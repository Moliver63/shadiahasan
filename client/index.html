    <!-- Consent Mode básico: não carrega o GA4 até a pessoa aceitar analytics. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      window.gtag = window.gtag || function () { window.dataLayer.push(arguments); };
      window.gtag("consent", "default", {
        analytics_storage: "denied",
        ad_storage: "denied",
        ad_user_data: "denied",
        ad_personalization: "denied",
        wait_for_update: 500
      });
    </script>
    
    <!--
      Meta Pixel — carregado aqui apenas após consentimento de analytics.

      Achado real (auditoria de 24/10, campanha 804): 19 cliques no link e 1
      visualização de página de destino. O pixel não estava quebrado; ele era
      injetado por um `useEffect` do React, então só nascia depois de o
      navegador baixar ~890 kB comprimidos e o React montar. Com 470 das 471
      impressões em `mobile_app` (navegador interno do app do Facebook) e 71%
      do público em 55+, a maioria saía antes disso. Aqui o pixel dispara
      independente do bundle, do React e do tempo de boot quando já há
      consentimento salvo. Sem consentimento, o Pixel aguarda o banner.

      O ID vem de VITE_META_PIXEL_ID, substituído pelo Vite no build. Sem a
      variável definida o bloco não faz nada: medir errado com um ID inventado
      é pior que não medir.

      `Analytics.tsx` continua responsável pelos eventos de conversão e pelo
      PageView das navegações internas. Ele checa `window.fbq` antes de
      inicializar, então não há init duplicado.
    -->
    <script>
      (function () {
        var id = "%VITE_META_PIXEL_ID%";
        // Variável ausente no build: o Vite deixa a string vazia ou o próprio
        // marcador. Nos dois casos não há pixel para iniciar.
        if (!id || id.charAt(0) === "%") return;
        try {
          var consent = JSON.parse(localStorage.getItem("cookie-consent") || "null");
          if (!consent || consent.analytics !== true) return;
        } catch (_) {
          return;
        }
        if (window.fbq) return;
        !(function (f, b, e, v, n, t, s) {
          if (f.fbq) return;
          n = f.fbq = function () {
            n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
          };
          if (!f._fbq) f._fbq = n;
          n.push = n;
          n.loaded = !0;
          n.version = "2.0";
          n.queue = [];
          t = b.createElement(e);
          t.async = !0;
          t.src = v;
          s = b.getElementsByTagName(e)[0];
          s.parentNode.insertBefore(t, s);
        })(window, document, "script", "https://connect.facebook.net/en_US/fbevents.js");
        fbq("init", id);
        fbq("track", "PageView");
        // Marca que o PageView de entrada já saiu, para o Analytics.tsx não
        // contar a mesma visita duas vezes.
        window.__metaPixelBooted = true;
      })();
    </script>
